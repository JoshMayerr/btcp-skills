interface:
  display_name: "Financial data sourcing"
  short_description: "Route financial data through authorized sources"
  default_prompt: "Use $financial-data-sourcing to acquire the financial data needed for this analysis."

dependencies:
  tools:
    - type: "mcp"
      value: "daloopa"
      description: "Daloopa financial data"
      transport: "streamable_http"
      url: "https://mcp.daloopa.com/server/mcp"
    - type: "mcp"
      value: "morningstar"
      description: "Morningstar investment data"
      transport: "streamable_http"
      url: "https://mcp.morningstar.com/mcp"
    - type: "mcp"
      value: "sp-global"
      description: "S&P Global financial data"
      transport: "streamable_http"
      url: "https://kfinance.kensho.com/integrations/mcp"
    - type: "mcp"
      value: "factset"
      description: "FactSet financial data"
      transport: "streamable_http"
      url: "https://mcp.factset.com/mcp"
    - type: "mcp"
      value: "moodys"
      description: "Moody's financial data"
      transport: "streamable_http"
      url: "https://api.moodys.com/genai-ready-data/m1/mcp"
    - type: "mcp"
      value: "mtnewswire"
      description: "MT Newswires financial news"
      transport: "streamable_http"
      url: "https://vast-mcp.blueskyapi.com/mtnewswires"
    - type: "mcp"
      value: "aiera"
      description: "Aiera event and transcript data"
      transport: "streamable_http"
      url: "https://mcp-pub.aiera.com"
    - type: "mcp"
      value: "lseg"
      description: "LSEG financial data"
      transport: "streamable_http"
      url: "https://api.analytics.lseg.com/lfa/mcp"
    - type: "mcp"
      value: "pitchbook"
      description: "PitchBook private-market data"
      transport: "streamable_http"
      url: "https://premium.mcp.pitchbook.com/mcp"
    - type: "mcp"
      value: "chronograph"
      description: "Chronograph private-capital data"
      transport: "streamable_http"
      url: "https://ai.chronograph.pe/mcp"
    - type: "mcp"
      value: "egnyte"
      description: "Egnyte document data"
      transport: "streamable_http"
      url: "https://mcp-server.egnyte.com/mcp"
    - type: "mcp"
      value: "box"
      description: "Box document data"
      transport: "streamable_http"
      url: "https://mcp.box.com"

policy:
  allow_implicit_invocation: true
